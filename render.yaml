# Personal testing deployment. API usage is billed separately by the provider.
# Free instances can sleep; review hosting requirements before relying on voice latency.
services:
  - type: web
    name: jarvis-personal-ai
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: JARVIS_SHARED_TOKEN
        generateValue: true
