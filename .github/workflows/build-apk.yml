name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jarvis-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Android project
        uses: actions/checkout@v6

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test AI backend with a mock provider
        working-directory: backend
        run: npm test

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android API 36 and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Test, check, and compile Android app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Verify first launch on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-boot-timeout: 300
          script: bash .github/scripts/smoke-test.sh

      - name: Verify APK signature and write checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug
          mv app-debug.apk JARVIS-AI-debug.apk
          sha256sum JARVIS-AI-debug.apk > SHA256SUMS.txt

      - name: Publish APK to workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-AI-Android-debug-APK
          path: |
            app/build/outputs/apk/debug/JARVIS-AI-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-test-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
